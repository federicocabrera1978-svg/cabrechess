name: Build and release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --onefile --windowed --name CabreChess cabrechess.py

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path dist/CabreChess.exe -Algorithm SHA256
          "$($hash.Hash)  CabreChess.exe" | Out-File -Encoding ascii CabreChess.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CabreChess.exe
            CabreChess.exe.sha256
