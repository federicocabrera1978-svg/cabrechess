name: Build and release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release notes from CHANGELOG
        # Falla si la etiqueta no coincide con cabrechess.__version__
        run: python tools/release_notes.py "${{ github.ref_name }}" release_notes.md

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.21.0

      - name: Build executable
        # El spec incluye assets/ (piezas y logo), el ícono y los metadatos de versión
        run: |
          pyinstaller CabreChess.spec
          pyinstaller --distpath dist-onedir CabreChess-onedir.spec
          Compress-Archive -Path dist-onedir/CabreChess -DestinationPath dist/CabreChess-win64.zip
        shell: pwsh

      # Uncomment once the project is approved by SignPath Foundation
      # (https://signpath.org/) and the SIGNPATH_API_TOKEN secret,
      # organization-id, project-slug and signing-policy-slug are set.
      # - name: Upload unsigned artifact for signing
      #   id: upload-unsigned-artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: CabreChess-unsigned
      #     path: dist/CabreChess.exe
      #
      # - name: Submit signing request
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<signpath-organization-id>'
      #     project-slug: 'cabrechess'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'dist-signed'

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path dist/CabreChess.exe -Algorithm SHA256
          "$($hash.Hash)  CabreChess.exe" | Out-File -Encoding ascii CabreChess.exe.sha256
          $zip = Get-FileHash -Path dist/CabreChess-win64.zip -Algorithm SHA256
          "$($zip.Hash)  CabreChess-win64.zip" | Out-File -Encoding ascii CabreChess-win64.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: CabreChess ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/CabreChess-win64.zip
            CabreChess-win64.zip.sha256
            dist/CabreChess.exe
            CabreChess.exe.sha256
