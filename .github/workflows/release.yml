name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notes:
    # Falla temprano si la etiqueta no coincide con cabrechess.__version__
    # o si el CHANGELOG no tiene esa sección.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Release notes from CHANGELOG
        run: python tools/release_notes.py "${{ github.ref_name }}" release_notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release_notes
          path: release_notes.md
          if-no-files-found: error

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.21.0

      - name: Build
        run: python tools/package.py

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: release_notes
          path: .

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: CabreChess ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/CabreChess-win64.zip
            dist/CabreChess-win64.zip.sha256
            dist/CabreChess.exe
            dist/CabreChess.exe.sha256
            dist/CabreChess-linux64.tar.gz
            dist/CabreChess-linux64.tar.gz.sha256
            dist/CabreChess-macos-arm64.dmg
            dist/CabreChess-macos-arm64.dmg.sha256

      # La firma con SignPath (D5) aplica al .exe de Windows; Linux y macOS
      # salen sin firmar. Descomentar cuando SignPath Foundation apruebe el
      # proyecto (https://signpath.org/) y estén el secreto SIGNPATH_API_TOKEN,
      # organization-id, project-slug y signing-policy-slug:
      # - name: Upload unsigned artifact for signing
      #   id: upload-unsigned-artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: CabreChess-unsigned
      #     path: dist/CabreChess.exe
      # - name: Submit signing request
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     organization-id: '<signpath-organization-id>'
      #     project-slug: 'cabrechess'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
      #     wait-for-completion: true
      #     output-artifact-directory: 'dist-signed'
