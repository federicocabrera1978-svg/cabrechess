name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  package:
    # `pip install .` (no editable) debe traer los assets dentro del paquete
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Smoke test desde fuera del repo
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import cabrechess, cabrechess.sprites as s; assert 'site-packages' in cabrechess.__file__; assert (s.ASSETS_DIR / 'pieces/cburnett/wK.png').is_file(); assert (s.ASSETS_DIR / 'logo/cabrechess_64.png').is_file(); print('ok', cabrechess.__version__)"
          which cabrechess

  dist:
    # Arma el paquete de cada sistema y lo sube como artifact:
    # Windows: CabreChess-win64.zip (onedir) + CabreChess.exe (onefile)
    # Linux:   CabreChess-linux64.tar.gz
    # macOS:   CabreChess-macos-arm64.dmg (Apple Silicon; macos-latest es arm64)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.21.0
      - name: Build
        run: python tools/package.py
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: CabreChess-${{ matrix.os }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
