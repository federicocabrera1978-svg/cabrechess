name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

  package:
    # `pip install .` (no editable) debe traer los assets dentro del paquete
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Smoke test desde fuera del repo
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import cabrechess, cabrechess.sprites as s; assert 'site-packages' in cabrechess.__file__; assert (s.ASSETS_DIR / 'pieces/cburnett/wK.png').is_file(); assert (s.ASSETS_DIR / 'logo/cabrechess_64.png').is_file(); print('ok', cabrechess.__version__)"
          which cabrechess

  exe:
    # Arma los dos formatos de Windows y los sube como artifacts:
    # - CabreChess-win64: carpeta onedir (recomendado: no se autoextrae a %TEMP%)
    # - CabreChess-exe:   onefile (un solo .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -r requirements.txt pyinstaller==6.21.0
          pyinstaller CabreChess.spec
          pyinstaller --distpath dist-onedir CabreChess-onedir.spec
      - name: Check
        shell: pwsh
        run: |
          if (!(Test-Path dist/CabreChess.exe)) { exit 1 }
          if (!(Test-Path dist-onedir/CabreChess/CabreChess.exe)) { exit 1 }
          if (!(Test-Path dist-onedir/CabreChess/_internal/cabrechess/assets/pieces/cburnett/wK.png)) { exit 1 }
      - name: Upload onedir
        uses: actions/upload-artifact@v4
        with:
          name: CabreChess-win64
          path: dist-onedir/CabreChess/
          retention-days: 14
          if-no-files-found: error
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CabreChess-exe
          path: dist/CabreChess.exe
          retention-days: 14
          if-no-files-found: error
